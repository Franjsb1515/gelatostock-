# Construye la app y el instalador .dmg de Mac en los Macs de GitHub (Apple Silicon e Intel).
# Se lanza a mano (Actions → «Instalador de Mac» → Run workflow) o al publicar una etiqueta v*.
# El .dmg queda como artefacto de la ejecución y, con etiqueta, como archivo de la «release».
# Todo lo de Mac está preparado desde Windows: la primera ejecución es la primera vez que la app
# corre en un Mac. Los registros de cada paso se publican en la rama registros-mac-<arch> del
# propio repositorio (legibles sin iniciar sesión) y como artefacto (docs/MAC.md).
name: Instalador de Mac
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
defaults:
  run:
    # bash con pipefail: si un paso falla dentro de «| tee», el paso falla.
    shell: bash
jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Comprobar el Mac
        run: |
          mkdir -p work/logs
          { uname -m; sw_vers; node -v; df -h .; } 2>&1 | tee work/logs/01-mac.log
      - name: Instalar dependencias
        run: npm ci 2>&1 | tee work/logs/02-npm-ci.log | tail -20
      - name: Descargar Electron y los binarios de la IA (npm ya no ejecuta scripts de instalación)
        run: |
          node node_modules/electron/install.js 2>&1 | tee work/logs/02b-electron.log
          ls node_modules/electron/dist | head -5
          node node_modules/onnxruntime-node/script/install 2>&1 | tee -a work/logs/02b-electron.log
          ls -R node_modules/onnxruntime-node/bin/napi-v6/darwin | head -20
      - name: Caché del modelo de IA y del Chrome de WhatsApp
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: |
            runtime/models
            runtime/browser
          key: runtime-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('runtime/ai-model.json') }}
      - name: Descargar el modelo de IA local
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: node scripts/setup-ai-model.cjs 2>&1 | tee work/logs/03-modelo.log
      - name: Descargar Chrome para WhatsApp
        run: node scripts/setup-browser.cjs 2>&1 | tee work/logs/04-chrome.log
      - name: Pruebas
        run: npm test 2>&1 | tee work/logs/05-pruebas.log | tail -40
      - name: Empaquetar la app (GelatoStock.app)
        run: npm run package:mac 2>&1 | tee work/logs/06-empaquetar.log
      - name: Arrancar la app empaquetada
        run: node scripts/mac-smoke.cjs 2>&1 | tee work/logs/07-arranque.log
      - name: Crear el instalador (.dmg)
        run: npm run installer:mac 2>&1 | tee work/logs/08-instalador.log
      - name: Guardar el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GelatoStock-Instalador-mac-${{ matrix.arch }}
          path: dist/instalador/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publicar en la release de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "GelatoStock ${GITHUB_REF_NAME}" --notes "Instaladores generados en GitHub Actions. Sin firma: ver docs/INSTALADOR.md." 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" dist/instalador/*.dmg --clobber
      - name: Diagnóstico si algo falla
        if: failure()
        run: |
          for f in work/logs/*.log; do
            echo "::group::$f"; tail -n 80 "$f"; echo "::endgroup::"
          done
          last=$(ls work/logs/*.log | tail -n 1)
          echo "::error::Falló en $last. $(grep -m 3 -E 'Error|error|FALLO|FAIL' "$last" | tr '\n' ' ' | cut -c1-700)"
      - name: Publicar los registros en la rama registros-mac-${{ matrix.arch }}
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          cp -R work/logs "$d/logs"
          cd "$d"
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add logs
          git commit -qm "registros de la ejecución ${GITHUB_RUN_ID} (${{ matrix.arch }})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:registros-mac-${{ matrix.arch }}
      - name: Guardar los registros como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-mac-${{ matrix.arch }}
          path: work/logs/
          if-no-files-found: ignore
          retention-days: 30
